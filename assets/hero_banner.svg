<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="880" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <radialGradient id="indigo-glow" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emerald-glow" cx="85%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <linearGradient id="line-glow" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Styles -->
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .font-mono { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .title { font-weight: 800; fill: #ffffff; letter-spacing: -0.03em; }
      .subtitle { font-weight: 500; fill: #94a3b8; font-size: 14.5px; letter-spacing: -0.01em; }
      .badge-label { font-size: 10.5px; font-weight: 700; fill: #10b981; letter-spacing: 0.08em; text-transform: uppercase; }
      .metric-title { font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .metric-sub { font-size: 10.5px; font-weight: 500; fill: #64748b; }
      .status-dot { fill: #10b981; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="880" height="270" rx="16" fill="url(#bg-gradient)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="880" height="270" rx="16" fill="url(#grid)" />
  <rect width="880" height="270" rx="16" fill="url(#indigo-glow)" />
  <rect width="880" height="270" rx="16" fill="url(#emerald-glow)" />
  <rect width="880" height="270" rx="16" fill="url(#purple-glow)" />

  <!-- Top Pill Badge -->
  <g transform="translate(42, 32)">
    <rect width="216" height="24" rx="12" fill="#064e3b" fill-opacity="0.45" stroke="#059669" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" class="status-dot">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="15.5" class="font-mono badge-label">SYSTEMS &amp; RELIABILITY</text>
  </g>

  <!-- Location / Availability Pill -->
  <g transform="translate(598, 32)">
    <rect width="240" height="24" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <text x="14" y="15.5" class="font-sans" font-size="11.5px" font-weight="600" fill="#94a3b8">📍 Ho Chi Minh City · Worldwide</text>
  </g>

  <!-- Main Title -->
  <text x="42" y="100" class="font-sans title" font-size="34px">HỒ KHẮC HUY</text>
  <text x="42" y="126" class="font-sans subtitle">
    Senior Software Engineer · Distributed Systems, Webhook Reliability &amp; Applied AI
  </text>

  <!-- Divider Glow -->
  <path d="M 42 148 L 838 148" stroke="url(#line-glow)" stroke-width="1.2" />

  <!-- 4 Flagship Metric Cards -->
  <!-- Card 1: HookSentinel -->
  <g transform="translate(42, 166)">
    <rect width="186" height="74" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />
    <rect x="1" y="1" width="184" height="2" rx="1" fill="#3b82f6" fill-opacity="0.7" />
    <text x="12" y="24" class="font-mono" font-size="11px" font-weight="600" fill="#38bdf8">HookSentinel</text>
    <text x="12" y="46" class="font-mono metric-title">6,661 req/s</text>
    <text x="12" y="62" class="font-sans metric-sub">0.58ms p99 · 78 Tests</text>
  </g>

  <!-- Card 2: PromptShield -->
  <g transform="translate(242, 166)">
    <rect width="186" height="74" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />
    <rect x="1" y="1" width="184" height="2" rx="1" fill="#818cf8" fill-opacity="0.7" />
    <text x="12" y="24" class="font-mono" font-size="11px" font-weight="600" fill="#a5b4fc">PromptShield</text>
    <text x="12" y="46" class="font-mono metric-title">1.64M scans/s</text>
    <text x="12" y="62" class="font-sans metric-sub">OWASP LLM01 · 0.4µs</text>
  </g>

  <!-- Card 3: ResilientDAG -->
  <g transform="translate(442, 166)">
    <rect width="186" height="74" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />
    <rect x="1" y="1" width="184" height="2" rx="1" fill="#34d399" fill-opacity="0.7" />
    <text x="12" y="24" class="font-mono" font-size="11px" font-weight="600" fill="#6ee7b7">ResilientDAG</text>
    <text x="12" y="46" class="font-mono metric-title">179k graphs/s</text>
    <text x="12" y="62" class="font-sans metric-sub">Kahn's DAG · Zero Loss</text>
  </g>

  <!-- Card 4: CrashProofWAL -->
  <g transform="translate(642, 166)">
    <rect width="196" height="74" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />
    <rect x="1" y="1" width="194" height="2" rx="1" fill="#f59e0b" fill-opacity="0.7" />
    <text x="12" y="24" class="font-mono" font-size="11px" font-weight="600" fill="#fcd34d">CrashProofWAL</text>
    <text x="12" y="46" class="font-mono metric-title">847k writes/s</text>
    <text x="12" y="62" class="font-sans metric-sub">CRC32 · 15ms Recovery</text>
  </g>
</svg>
